<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RICHEN - Exclusive Perfume Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --black: #111111; --white: #ffffff; --bg: #f4f4f4; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: #333; overflow-x: hidden; width: 100%; }

        /* --- NAVIGATION --- */
        header { background: var(--black); padding: 15px 5%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .header-main { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        .logo { font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: 2px; cursor: pointer; user-select: none; flex-shrink: 0; }
        .search-bar { flex: 1; display: flex; background: var(--white); border-radius: 4px; overflow: hidden; max-width: 600px; min-width: 200px; }
        @media (max-width: 600px) { .search-bar { order: 3; flex-basis: 100%; } .logo { font-size: 22px; } }
        .search-bar input { flex: 1; border: none; padding: 10px 15px; outline: none; width: 100%; }
        .search-bar button { background: var(--gold); border: none; padding: 0 20px; color: white; cursor: pointer; }
        .header-icons { display: flex; gap: 20px; color: var(--white); font-size: 20px; flex-shrink: 0; }
        .cart-icon { cursor: pointer; position: relative; }
        .cart-count { position: absolute; top: -10px; right: -10px; background: #ff4d4d; color: white; font-size: 11px; padding: 2px 6px; border-radius: 50%; }

        /* --- BANNER SLIDER (Disesuaikan untuk Laptop & HP) --- */
        .slider-container { 
            width: 100%; 
            /* Tinggi untuk Laptop/Desktop */
            height: 450px; 
            position: relative; 
            overflow: hidden; 
            background: #000; 
        }

        /* Responsive Height untuk HP (Mobile) */
        @media (max-width: 768px) {
            .slider-container {
                /* Tinggi yang lebih proporsional untuk layar HP agar tidak terlalu jangkung */
                height: 250px; 
            }
        }

        .slide { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            opacity: 0; 
            transition: opacity 0.8s ease-in-out; 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            will-change: opacity; 
        }
        .slide.active { opacity: 1; }
        
        /* Slide-content (Teks dihapus, filter none di CSS) */
        .slide video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; filter: none; }
        
        .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.3); color: var(--gold); border: none; padding: 15px; cursor: pointer; z-index: 10; font-size: 20px; }
        .prev { left: 0; } .next { right: 0; }
        .dots-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.4); border-radius: 50%; cursor: pointer; }
        .dot.active { background: var(--gold); width: 25px; border-radius: 10px; }

        /* --- CATEGORIES --- */
        .categories { display: flex; justify-content: flex-start; gap: 10px; padding: 20px; background: #fff; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        @media (min-width: 769px) { .categories { justify-content: center; } }
        .cat-btn { padding: 8px 20px; border: 1px solid var(--gold); border-radius: 20px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.3s; flex-shrink: 0; }
        .cat-btn.active, .cat-btn:hover { background: var(--gold); color: white; }

        /* --- PRODUCTS --- */
        .product-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px 5%; }
        @media (min-width: 600px) { .product-container { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; } }
        .product-card { background: #fff; border-radius: 10px; border: 1px solid #ddd; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s; position: relative; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 200px; object-fit: cover; }
        @media (min-width: 600px) { .product-img { height: 240px; } }
        .disc-badge { position: absolute; top: 10px; left: 10px; background: #e74c3c; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; z-index: 2; }
        .product-info { padding: 12px; flex-grow: 1; }
        .product-name { font-weight: 600; font-size: 14px; margin-bottom: 5px; height: 40px; overflow: hidden; }
        @media (min-width: 600px) { .product-name { font-size: 16px; height: 45px; } }
        .product-price { color: var(--gold); font-weight: 700; font-size: 16px; margin-bottom: 12px; }
        .action-btns { display: flex; gap: 5px; }
        .btn-cart { flex: 1; background: #fff; border: 1px solid var(--black); padding: 8px; cursor: pointer; border-radius: 4px; }
        .btn-buy { flex: 2; background: var(--black); color: #fff; border: none; padding: 8px; cursor: pointer; font-weight: bold; border-radius: 4px; }

        /* --- ADMIN PANEL --- */
        #admin-panel { display: none; background: #fff; margin: 30px 5%; padding: 25px; border: 2px solid var(--gold); border-radius: 10px; }
        .admin-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .admin-form input, .admin-form select { padding: 12px; border: 1px solid #ccc; border-radius: 5px; }
        .admin-table-container { width: 100%; overflow-x: auto; margin-top: 20px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 550px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .btn-edit { background: #2ecc71; color: #fff; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; margin-right: 5px; }
        .btn-delete { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }

        /* --- CART SIDEBAR --- */
        #cart-modal { position: fixed; right: -100%; top: 0; width: 380px; height: 100%; background: #fff; box-shadow: -10px 0 30px rgba(0,0,0,0.2); z-index: 2000; transition: 0.4s; padding: 25px; display: flex; flex-direction: column; }
        #cart-modal.active { right: 0; }
        @media (max-width: 400px) { #cart-modal { width: 100%; } }

        /* --- FOOTER --- */
        footer { background: var(--black); color: white; padding: 50px 5% 20px; margin-top: 50px; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; }
        .footer-grid h4 { color: var(--gold); margin-bottom: 20px; }
        .footer-grid p { color: #ccc; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .social-icons a { font-size: 24px; color: var(--gold); margin-right: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <div class="logo" id="logoAdmin">RICHEN</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Cari parfum favorit..." onkeyup="liveSearch()">
                <button aria-label="Search"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-icons">
                <div class="cart-icon" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <div class="slider-container">
        <button class="slide-btn prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <button class="slide-btn next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
        
        <div class="slide active" style="background-image: url('https://raw.githubusercontent.com/richenofficial/katalog/main/Banner.jpg');">
        </div>

        <div class="slide" style="background-image: url('https://raw.githubusercontent.com/richenofficial/katalog/main/Banner2.jpg');">
        </div>

        <div class="slide" style="background-image: url('https://raw.githubusercontent.com/richenofficial/katalog/main/Banner5.jpg');">
        </div>

        <div class="slide" style="background-image: url('https://raw.githubusercontent.com/richenofficial/katalog/main/Banner4.jpg');">
        </div>

        <div class="dots-container" id="dotsArea"></div>
    </div>

    <div class="categories">
        <div class="cat-btn active" onclick="filterByCat('all', this)">Semua Produk</div>
        <div class="cat-btn" onclick="filterByCat('pria', this)">Parfum Pria</div>
        <div class="cat-btn" onclick="filterByCat('wanita', this)">Parfum Wanita</div>
        <div class="cat-btn" onclick="filterByCat('unisex', this)">Unisex</div>
    </div>

    <div class="product-container" id="productGrid"></div>

    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="admHeader">Tambah Produk</h2>
            <button onclick="closeAdmin()" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">[Tutup]</button>
        </div>
        <div class="admin-form">
            <input type="hidden" id="editIdx" value="-1">
            <input type="text" id="admName" placeholder="Nama Parfum">
            <input type="number" id="admPrice" placeholder="Harga">
            <select id="admCat">
                <option value="pria">Pria</option>
                <option value="wanita">Wanita</option>
                <option value="unisex">Unisex</option>
            </select>
            <input type="text" id="admDisc" placeholder="Diskon (cth: 10%)">
            <input type="file" id="admFile" accept="image/*">
            <input type="text" id="admImg" placeholder="Link Foto (Opsional)">
            <button class="btn-save" id="btnSave" onclick="processProduct()" style="background:var(--gold); color:white; border:none; padding:12px; border-radius:5px; font-weight:bold; cursor:pointer;">Simpan Ke Toko</button>
        </div>
        <div class="admin-table-container">
            <table>
                <thead><tr><th>Produk</th><th>Harga</th><th>Kategori</th><th>Aksi</th></tr></thead>
                <tbody id="admTbody"></tbody>
            </table>
        </div>
    </div>

    <div id="cart-modal">
        <h3>Keranjang Belanja</h3>
        <hr style="margin: 15px 0;">
        <div id="cartList" style="flex-grow: 1; overflow-y: auto;"></div>
        <div style="padding-top: 20px; border-top: 2px solid #eee;">
            <h4>Total: <span id="cartTotal" style="color:var(--gold)">Rp 0</span></h4>
            <button class="btn-buy" style="width:100%; margin-top:15px; padding: 15px;" onclick="checkoutWhatsApp()">Checkout ke WhatsApp</button>
            <button class="btn-cart" style="width:100%; margin-top:10px;" onclick="toggleCart()">Kembali</button>
        </div>
    </div>

    <footer>
        <div class="footer-grid">
            <div>
                <h4>RICHEN OFFICIAL</h4>
                <p>Marketplace parfum modern dengan kurasi aroma terbaik.</p>
                <div class="social-icons">
                    <a href="https://www.instagram.com/richen_official?igsh=MmE3b3R6NGYyMGZ4" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://www.tiktok.com/@richen.indonesia?_r=1&_t=ZS-96Ke6N0RyYK" target="_blank"><i class="fab fa-tiktok"></i></a>
                    <a href="https://wa.me/6283814559667" target="_blank"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
            <div>
                <h4>Layanan</h4>
                <p onclick="alert('Instagram: @richen_official\nTiktok: @richen.indonesia')">Akun Sosial Media</p>
                <p onclick="alert('Cara Beli:\n1. Pilih Parfum\n2. Klik Beli Sekarang / Tambah Keranjang\n3. Selesaikan pembayaran via WA Admin')">Cara Pembelian</p>
                <p onclick="alert('Pengiriman ke seluruh Indonesia via Ekspedisi terpercaya.')">Pengiriman</p>
            </div>
        </div>
        <div style="text-align:center; margin-top:40px; font-size:12px; color:#777; border-top:1px solid #333; padding-top:20px;">
            &copy; 2026 RICHEN Perfume Marketplace.
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPhe6-bKRdrpe0X5BW2xzDR0MplE1hV-c",
            authDomain: "richen-perfume.firebaseapp.com",
            databaseURL: "https://richen-perfume-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "richen-perfume",
            storageBucket: "richen-perfume.firebasestorage.app",
            messagingSenderId: "724141266273",
            appId: "1:724141266273:web:6808007b84619d2ca22120",
            measurementId: "G-3KRY9KV1QX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let products = [], cart = [];

        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            products = [];
            if (data) {
                for (let id in data) products.push({ id, ...data[id] });
            }
            renderProducts(products);
        }, (error) => { console.error(error); });

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = data.map(p => `
                <div class="product-card">
                    ${p.disc ? `<div class="disc-badge">${p.disc} OFF</div>` : ''}
                    <img src="${p.img || 'https://via.placeholder.com/400'}" class="product-img" loading="lazy">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">Rp ${parseInt(p.price).toLocaleString('id-ID')}</div>
                        <div class="action-btns">
                            <button class="btn-cart" onclick="addToCart('${p.id}')"><i class="fas fa-shopping-cart"></i></button>
                            <button class="btn-buy" onclick="buyNow('${p.name}')">Beli</button>
                        </div>
                    </div>
                </div>
            `).join('');
            renderAdminTable();
        }

        function liveSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
        }

        function filterByCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat === 'all' ? products : products.filter(p => p.category === cat));
        }

        function addToCart(id) {
            const p = products.find(i => i.id === id);
            const ex = cart.find(i => i.id === id);
            if(ex) ex.qty++; else cart.push({...p, qty: 1});
            updateCartUI(); alert("Ditambah ke keranjang!");
        }

        function updateCartUI() {
            let total = 0, count = 0;
            document.getElementById('cartList').innerHTML = cart.map((item, index) => {
                total += item.price * item.qty; count += item.qty;
                return `<div class="cart-item" style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <img src="${item.img}" style="width:40px;height:40px;object-fit:cover;border-radius:5px">
                    <div style="flex-grow:1;font-size:13px"><b>${item.name}</b><br>Rp ${parseInt(item.price).toLocaleString()}</div>
                    <input type="number" value="${item.qty}" min="1" onchange="changeQty(${index}, this.value)" style="width:40px">
                    <i class="fas fa-trash" style="color:red;cursor:pointer" onclick="removeItem(${index})"></i>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = "Rp " + total.toLocaleString('id-ID');
            document.getElementById('cartCount').innerText = count;
        }

        function changeQty(i, v) { cart[i].qty = parseInt(v); updateCartUI(); }
        function removeItem(i) { cart.splice(i, 1); updateCartUI(); }
        function buyNow(n) { window.open(`https://wa.me/6283814559667?text=Saya ingin beli: ${n}`); }
        function toggleCart() { document.getElementById('cart-modal').classList.toggle('active'); }
        function checkoutWhatsApp() {
            let m = "Halo RICHEN, saya ingin pesan:\n";
            cart.forEach(i => m += `- ${i.name} (${i.qty}x)\n`);
            window.open(`https://wa.me/6283814559667?text=${encodeURIComponent(m)}`);
        }

        /* --- ADMIN LOGIC --- */
        let taps = 0;
        document.getElementById('logoAdmin').onclick = () => {
            taps++; if(taps >= 5) { if(prompt("Password:") === "richen123") document.getElementById('admin-panel').style.display = "block"; taps = 0; }
        };
        function closeAdmin() { document.getElementById('admin-panel').style.display = "none"; }

        function renderAdminTable() {
            document.getElementById('admTbody').innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>Rp ${parseInt(p.price).toLocaleString()}</td>
                    <td>${p.category}</td>
                    <td>
                        <button class="btn-edit" onclick="startEdit('${p.id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteProd('${p.id}')">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        function processProduct() {
            const n = document.getElementById('admName').value, pr = document.getElementById('admPrice').value, id = document.getElementById('editIdx').value;
            const save = (img) => {
                const data = { name: n, price: parseInt(pr), category: document.getElementById('admCat').value, disc: document.getElementById('admDisc').value, img };
                if (id === "-1") db.ref('products').push(data); else db.ref('products/' + id).update(data);
                resetForm(); alert("Berhasil!");
            };
            const f = document.getElementById('admFile');
            if (f.files[0]) {
                const r = new FileReader(); r.onload = (e) => save(e.target.result); r.readAsDataURL(f.files[0]);
            } else save(document.getElementById('admImg').value || (id !== "-1" ? products.find(p => p.id == id).img : 'https://via.placeholder.com/400'));
        }

        function startEdit(id) {
            const p = products.find(i => i.id == id);
            document.getElementById('admName').value = p.name; document.getElementById('admPrice').value = p.price;
            document.getElementById('admCat').value = p.category; document.getElementById('admDisc').value = p.disc;
            document.getElementById('editIdx').value = p.id; document.getElementById('btnSave').innerText = "Update Produk";
            window.scrollTo(0, document.getElementById('admin-panel').offsetTop);
        }

        function deleteProd(id) { if(confirm("Hapus?")) db.ref('products/' + id).remove(); }
        function resetForm() {
            document.getElementById('editIdx').value = "-1"; document.getElementById('btnSave').innerText = "Simpan Ke Toko";
            document.getElementById('admName').value = ""; document.getElementById('admPrice').value = ""; document.getElementById('admFile').value = "";
        }

        /* --- SLIDER --- */
        let sIdx = 0;
        const slides = document.querySelectorAll('.slide');
        function moveSlide(n) {
            slides[sIdx].classList.remove('active'); 
            sIdx = (sIdx + n + slides.length) % slides.length; 
            slides[sIdx].classList.add('active');
        }
        setInterval(() => moveSlide(1), 5000);
    </script>
</body>
</html>
